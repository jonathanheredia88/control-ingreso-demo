<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo retirada · Campus Norte</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f3f6f8;--panel:#fff;--ink:#14232e;--muted:#5b6b77;--brand:#0f4c81;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--panel:#17222b;--ink:#e8eef2;--muted:#9fb0bc;--brand:#4f9ae0;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:440px;background:var(--panel);border-radius:14px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{color:var(--brand);font-size:1.4rem;margin:0 0 8px}p{margin:0 0 12px}.small{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="" width="56" height="56" style="border-radius:12px">
  <h1>Esta demo fue retirada</h1>
  <p>El control de ingreso, la salida segura y los avisos a las familias ahora forman parte de <b>ANAI Comunica · Campus Norte</b>.</p>
  <p class="small">Si instalaste esta demo en tu celular, puedes eliminar el ícono de la pantalla de inicio.</p>
</main>
<script>
// Desinstala el service worker de la demo y borra su caché
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script>
</body>
</html>
